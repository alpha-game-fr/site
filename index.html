<script>

function randomFromArray(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function generateFrenchIP() {
    const frenchRanges = ["51","82","90","91","92","93","176","178","213"];
    return randomFromArray(frenchRanges) + "." +
           Math.floor(Math.random()*255) + "." +
           Math.floor(Math.random()*255) + "." +
           Math.floor(Math.random()*255);
}

function generateSHA() {
    const chars = "abcdef0123456789";
    let hash = "";
    for (let i = 0; i < 64; i++) {
        hash += chars[Math.floor(Math.random() * chars.length)];
    }
    return hash;
}

function generateSessionID() {
    return "SID-" + Math.random().toString(36).substring(2,15).toUpperCase();
}

function confirmParticipation() {

    const container = document.querySelector(".container");

    container.innerHTML = `
        <div class="cinematic">
            <div class="fade"></div>
        </div>
    `;

    setTimeout(() => {

        container.innerHTML = `
            <h2>Initialisation du protocole Alpha…</h2>
            <div class="progress-bar">
                <div class="progress"></div>
            </div>
            <div id="log" class="log"></div>
        `;

        const progress = document.querySelector(".progress");
        const log = document.getElementById("log");

        const steps = [
            "Connexion au nœud régional sécurisé – Marseille (FR-13)…",
            "Latence mesurée : " + (80 + Math.floor(Math.random()*220)) + " ms",
            "Négociation TLS 1.3 – Cipher suite AES-256-GCM…",
            "Vérification certificat serveur (RSA-4096)…",
            "Transmission vers serveur central…",
            "Génération empreinte SHA-256…",
            "Écriture registre d’audit national…"
        ];

        let width = 0;
        let stepIndex = 0;

        const interval = setInterval(function() {

            width += Math.random()*7;
            progress.style.width = width + "%";

            if (stepIndex < steps.length && width > (stepIndex+1)*14) {
                log.innerHTML += `<div>✔ ${steps[stepIndex]}</div>`;
                stepIndex++;
            }

            if (width >= 100) {
                clearInterval(interval);

                const ip = generateFrenchIP();
                const sha = generateSHA();
                const session = generateSessionID();
                const ref = "PA-" + new Date().getFullYear() + "-" + Math.floor(Math.random()*9000+1000);
                const timestamp = new Date().toISOString();

                container.innerHTML = `
                    <h2 style="color:#1d3557;">Autorisation validée</h2>

                    <p>Votre participation a été enregistrée dans le registre sécurisé.</p>

                    <div class="box-tech">
                        <p><strong>Référence dossier :</strong> ${ref}</p>
                        <p><strong>Session ID :</strong> ${session}</p>
                        <p><strong>Horodatage ISO :</strong> ${timestamp}</p>
                        <p><strong>Adresse IP détectée :</strong> ${ip}</p>
                        <p><strong>Empreinte SHA-256 :</strong><br>
                        <span class="hash">${sha}</span></p>
                        <p><strong>Signature numérique :</strong><br>
                        -----BEGIN PGP SIGNATURE-----<br>
                        iQIzBAEBCAAdFiEE${sha.substring(0,32)}<br>
                        -----END PGP SIGNATURE-----</p>
                    </div>

                    <hr style="margin:30px 0;">

                    <p style="font-size:14px;color:#444;">
                    Votre accès au protocole Alpha est désormais actif.<br>
                    Toute activité est consignée.
                    </p>
                `;
            }

        }, 180);

    }, 800);
}

</script>
